name: App build and push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-build-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: it-tools

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::615445513774:role/it-tools-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Work out the image tag (short commit SHA)
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check whether this tag is already in ECR
        id: exists
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ steps.vars.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the image
        if: steps.exists.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" app
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"

      - name: Job summary
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`${{ steps.vars.outputs.tag }}\` (already existed: ${{ steps.exists.outputs.exists }})" >> "$GITHUB_STEP_SUMMARY"