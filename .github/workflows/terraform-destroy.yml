name: Terraform destroy (ALB and ECS only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type destroy to confirm"
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

defaults:
  run:
    working-directory: terraform

jobs:
  destroy:
    if: ${{ inputs.confirm == 'destroy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::615445513774:role/it-tools-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1

      - name: Init
        run: terraform init -input=false

      - name: Destroy ALB and ECS
        run: terraform destroy -auto-approve -input=false -no-color -target=module.ecs -target=module.alb -var "image_tag=unused"